name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start application
        env:
          ADMIN_USERNAME: Rivan
          ADMIN_PASSWORD: ${{ secrets.SUPPORT_AGENT_PASSWORD }}
          PORT: 3000
          HOST: 0.0.0.0
        run: |
  node server.js &
  for i in {1..30}; do
    curl -fsS http://127.0.0.1:3000 >/dev/null && break
    sleep 1
  done

      - name: Run Playwright tests
        env:
          SUPPORT_AGENT_PASSWORD: ${{ secrets.SUPPORT_AGENT_PASSWORD }}
          TEST_PASSWORD: ${{ secrets.SUPPORT_AGENT_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7